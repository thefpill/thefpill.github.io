---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-date">[ {{ page.date | date: "%Y-%m-%d %H:%M" }} ]</div>
    {% if page.tags %}
      <div class="tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

    <div style="margin-top: 2rem; border-top: 1px dashed var(--muted); padding-top: 1rem;">
    <a href="{{ '/' | relative_url }}">Return home</a>
  </div>
</article>
